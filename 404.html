  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try {
      const theme = localStorage.getItem("harp-generators:theme");
      if (theme) document.documentElement.dataset.theme = theme;
    } catch { }
    // Embedded in a documentation page, which already shows the site header. When the page is on
    // the same site, follow its light or dark theme as it changes.
    if (window.self !== window.top) {
      document.documentElement.classList.add("embedded");
      try {
        const host = window.parent.document.documentElement;
        const follow = () => {
          const theme = host.getAttribute("data-bs-theme");
          if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
        };
        follow();
        new window.parent.MutationObserver(follow).observe(host, { attributes: true, attributeFilter: ["data-bs-theme"] });
      } catch { }
    }
  </script>
